name: Sasadiakopi Data Analysis CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Compile source and tests
        run: python -m compileall -q src tests

      - name: Generate synthetic database
        run: python -m src.data_generator

      - name: Run analytics pipeline
        run: python -m src.pipeline

      - name: Check Git diff
        run: git diff --check